name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node gtg/test/gtg.test.mjs
      - run: node gtg/test/issues.test.mjs
      - run: node projects/test/projects.test.mjs
      - run: node projects/test/projects-index-guard.test.mjs
      # Must stay on the ubuntu-latest runner, never a container: learn's write-failure test
      # chmods a sprint file to 0444 and expects the write to be denied. The runner's non-root
      # `runner` user honours that; root in a container would write anyway and the test would
      # pass while proving nothing.
      - run: node learn/test/learn.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown dnspython
      # Network-tolerant by construction: the batch tests stub has_mx, and the one real
      # lookup asserts a nonexistent host resolves False, which is also what any resolver
      # failure returns. So this passes on a runner with no DNS egress.
      # cwd-independent: fixture_home() points POSTMAN_HOME at a tempdir for the whole run,
      # the example config resolves from __file__, and Python puts the script's own
      # directory on sys.path[0]. Verified from the repo root and from the skill directory.
      - run: python postman/skills/postman/postman.py --selftest
